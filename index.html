<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHOBEO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    max-width:700px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    animation:fadeIn 2s;
}

h1{
    color:#ff4d6d;
    margin-bottom:20px;
    font-size:3em;
}

p{
    font-size:1.2em;
    line-height:1.8;
    color:#444;
}

.heart{
    position:absolute;
    color:red;
    font-size:25px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

button{
    margin-top:25px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">
    <h1>Cho beo</h1>

    <p>
       Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo 
        Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo Cho beo 
    </p>

    <button onclick="showMessage()">
        Nhấn vào đây ❤️
    </button>
</div>

<script>
function showMessage(){
    alert("Chúc cô có một ngày 20/11 thật vui vẻ và ý nghĩa! 🌹");
}

for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*5)+"s";
    heart.style.opacity=Math.random();

    document.body.appendChild(heart);
}
</script>

</body>
</html>
